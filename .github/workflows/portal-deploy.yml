name: Deploy portal to GitHub Pages

# The portal is an internal knowledge base. Auto-deploy on push was removed so
# that publishing is always a deliberate act rather than a side effect of a
# content commit. Trigger manually from the Actions tab if you intend to publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        working-directory: portal
        run: npm ci

      # Gates: frontmatter schema, controlled tags, internal links, machine
      # artifacts, a11y floor, and confidentiality leak detection.
      - name: Build and validate
        working-directory: portal
        run: npm run build

      - name: Staleness report
        working-directory: portal
        run: npm run staleness
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
