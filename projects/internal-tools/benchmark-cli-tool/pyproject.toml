[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "benchmark-cli-tool"
version = "0.1.0"
description = "Document ingestion, hybrid retrieval, and retrieval evaluation"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
benchmark-ingest = "benchmark_cli.ingestion.pipeline:main"
benchmark-evaluate = "benchmark_cli.evaluation.cli:main"
benchmark-search = "benchmark_cli.search_cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not integration_live'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: deterministic isolated tests",
  "integration: tests requiring a local PostgreSQL service",
  "integration_live: real pgvector and OpenAI-embedding integration tests",
  "eval: retrieval evaluation tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/benchmark_cli/storage/sql" = "benchmark_cli/storage/sql"
